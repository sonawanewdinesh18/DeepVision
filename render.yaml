services:
  - type: web
    name: deepvision-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://deep-vision-five.vercel.app,https://deepvision-five.vercel.app,http://localhost:5173"
      - key: SUPABASE_STORAGE_BUCKET
        value: "detection-media"
      # Model weights are baked into the Docker image at build time (downloaded from HF).
      # model.py applies dynamic INT8 quantization automatically on first load.
      - key: MODEL_PATH
        value: "./models/Hybrid_vit.pth"
      - key: MODEL_VERSION
        value: "HybridViTCNN-v1.0"
      - key: DEVICE
        value: "cpu"
      - key: CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: VIDEO_SAMPLE_FRAMES
        value: "8"
      - key: MAX_IMAGE_SIZE_BYTES
        value: "20971520"
      - key: MAX_VIDEO_SIZE_BYTES
        value: "104857600"
      - key: MAX_VIDEO_DURATION_SECONDS
        value: "120"
      # ── Secrets: add these in Render Dashboard → Environment ──────────────
      # Never commit real secret values to git. Set them via the Render UI.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
