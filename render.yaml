services:
  - type: web
    name: deepvision-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://deep-vision-five.vercel.app,https://deepvision-five.vercel.app,http://localhost:5173"
      - key: SUPABASE_STORAGE_BUCKET
        value: "detection-media"
