services:
  - type: web
    name: deepvision-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://deep-vision-five.vercel.app,https://deepvision-five.vercel.app,http://localhost:5173"
      - key: SUPABASE_STORAGE_BUCKET
        value: "detection-media"
      - key: MODEL_PATH
        value: "./models/Hybrid_vit_int8.pth"
      - key: MODEL_VERSION
        value: "HybridViTCNN-v1.0-INT8"
      - key: DEVICE
        value: "cpu"
      - key: CONFIDENCE_THRESHOLD
        value: "0.5"
      - key: VIDEO_SAMPLE_FRAMES
        value: "8"
      - key: MAX_IMAGE_SIZE_BYTES
        value: "20971520"
      - key: MAX_VIDEO_SIZE_BYTES
        value: "104857600"
      - key: MAX_VIDEO_DURATION_SECONDS
        value: "120"
      # ── Sightengine Vision API (set in Render Dashboard → Environment) ──
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false
      # ── HF Space inference API (set to true to skip local PyTorch on Render) ──
      # Set USE_HF_API=true and HF_API_URL to your Space URL in Render dashboard.
      # This lets Render run with zero PyTorch RAM — model runs on HF Space instead.
      - key: USE_HF_API
        sync: false
      - key: HF_API_URL
        sync: false
      - key: HF_API_TOKEN
        sync: false
      # ── Supabase secrets (set in Render Dashboard → Environment) ──────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
